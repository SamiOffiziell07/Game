      pointer-events: auto;
      touch-action: none;
      letter-spacing: 0.5px;
    }
    /* Tiny key-cap shown above each action button — desktop only */
    .action-btn .keycap {
      position: absolute;
      top: -14px; left: 50%; transform: translateX(-50%);
      background: #fff; color: #1b1d2a;
      border: 2px solid #0a0c18;
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 2px 0 #0a0c18;
      white-space: nowrap;
      pointer-events: none;
      display: none;
    }
    /* Reveal only on confirmed desktop (fine pointer + hover capability) */
    @media (hover: hover) and (pointer: fine) {
      .action-btn .keycap { display: block; }
    }
    .action-btn:active, .action-btn.pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0a0c18, 0 4px 8px rgba(0,0,0,0.4);
    }
    #btn-shoot {
      background: linear-gradient(180deg, #ff8b3d, #ff3b6b);
      width: 96px; height: 96px;
      font-size: 22px;
    }
    #btn-pass {
      background: linear-gradient(180deg, #5fe0a8, #2ec3ff);
    }

    /* ===== Overlay screens ===== */
    .overlay {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(11,16,32,0.5), rgba(11,16,32,0.92));
      display: grid; place-items: center;
      z-index: 50;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .panel {
      background: linear-gradient(180deg, #2a2f4a, #161a2d);
      border: 4px solid #0a0c18;
      border-radius: 28px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 10px 0 #0a0c18, 0 20px 40px rgba(0,0,0,0.5);
      max-width: 88vw;
      min-width: 280px;
    }
    .panel h1 {
      margin: 0 0 6px; font-size: 44px;
      background: linear-gradient(180deg, #ffd23f, #ff8b3d);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      text-shadow: 0 4px 0 rgba(0,0,0,0.3);
      letter-spacing: 1px;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5));
    }
    .panel .sub {
      font-size: 16px; color: #b8bfd8; margin-bottom: 22px;
      letter-spacing: 0.5px;
    }
    .big-btn {
      background: linear-gradient(180deg, #ffd23f, #ff8b3d);
      color: #1b1d2a;
      border: 4px solid #0a0c18;
      border-radius: 20px;
      padding: 14px 36px;
      font-family: inherit; font-weight: 700; font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 0 #0a0c18, 0 10px 20px rgba(0,0,0,0.4);
      transition: transform 0.08s, box-shadow 0.08s;
      letter-spacing: 1px;
    }
    .big-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0a0c18;
    }
    .download-btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 11px 16px;
      background: linear-gradient(180deg, #5b6688, #343b58);
      color: #fff;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    #download-status {
      min-height: 18px;
      margin-top: 8px;
      color: #b8bfd8;
      font-size: 12px;
    }
    .goal-banner {
      font-size: 88px;
      font-weight: 700;
      background: linear-gradient(180deg, #ffd23f, #ff3b6b);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 0 rgba(0,0,0,0.5));
      letter-spacing: 4px;
      animation: pop 0.6s cubic-bezier(.2,1.4,.4,1);
    }
    @keyframes pop {
      0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
      60% { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .hidden { display: none !important; }

    /* Set-piece banner (throw-in / goal kick) */
    #setpiece-banner {
      position: absolute; top: 32%; left: 0; right: 0;
      display: grid; place-items: center;
      pointer-events: none; z-index: 40;
      animation: slideIn 0.4s cubic-bezier(.2,1.4,.4,1);
    }
    .setpiece-text {
      background: linear-gradient(180deg, #ffd23f, #ff8b3d);
      color: #1b1d2a;
      padding: 12px 28px;
      border: 4px solid #0a0c18;
      border-radius: 18px;
      font-size: 32px; font-weight: 700;
      letter-spacing: 3px;
      box-shadow: 0 6px 0 #0a0c18, 0 12px 24px rgba(0,0,0,0.5);
      text-shadow: 0 2px 0 rgba(255,255,255,0.3);
    }
    @keyframes slideIn {
      0% { transform: translateY(-30px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* Modifier announcement (big, centered, brief) */
    #modifier-banner {
      position: absolute; top: 28%; left: 0; right: 0;
      display: grid; place-items: center;
      pointer-events: none; z-index: 41;
      animation: modPop 0.5s cubic-bezier(.2,1.4,.4,1);
      text-align: center;
    }
    .mod-emoji {
      font-size: 72px; line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
      animation: spin 1.2s ease-in-out;
    }
    .mod-title {
      margin-top: 8px;
      font-size: 38px; font-weight: 700;
      background: linear-gradient(180deg, #ffffff, #ffd23f);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,0.6));
      letter-spacing: 3px;
    }
    .mod-sub {
      font-size: 16px; color: #ffffff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.5);
      letter-spacing: 1px;
      margin-top: 4px;
    }
    @keyframes modPop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes spin {
      0% { transform: rotate(-20deg) scale(0.5); }
      50% { transform: rotate(20deg) scale(1.2); }
      100% { transform: rotate(0) scale(1); }
    }

    /* Active modifier chip near scoreboard */
    #modifier-chip {
      position: absolute;
      top: calc(env(safe-area-inset-top, 14px) + 76px);
      left: 50%; transform: translateX(-50%);
      background: linear-gradient(180deg, #2a2f4a, #161a2d);
      border: 3px solid #0a0c18;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 14px; font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffd23f;
      box-shadow: 0 4px 0 #0a0c18, 0 8px 16px rgba(0,0,0,0.4);
      display: flex; align-items: center; gap: 8px;
      z-index: 11;
      pointer-events: none;
    }
    #modifier-chip-emoji { font-size: 18px; }
    #modifier-chip-time {
      background: #0a0c18; color: white;
      padding: 2px 8px; border-radius: 8px;
      min-width: 22px; text-align: center;
      font-size: 13px;
    }

    /* Title screen art */
    .title-emoji {
      font-size: 64px;
      margin-bottom: 6px;
      animation: bob 2s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    .controls-hint {
      font-size: 13px; color: #b8bfd8;
      margin-top: 16px; line-height: 1.8;
    }
    .controls-hint .hint-row {
      display: flex; align-items: center; justify-content: center;
      gap: 4px; flex-wrap: wrap;
      margin: 2px 0;
    }
    .controls-hint .kbd {
      display: inline-grid; place-items: center;
      min-width: 20px; height: 22px; padding: 0 6px;
      background: linear-gradient(180deg, #fff, #d0d6e8);
      color: #1b1d2a;
      border: 2px solid #0a0c18;
      border-radius: 6px;
      font-size: 11px; font-weight: 700;
      box-shadow: 0 2px 0 #0a0c18;
      letter-spacing: 0.5px;
      margin: 0 1px;
    }
    .controls-hint .kbd-wide { padding: 0 10px; }
    .controls-hint .kbd-row { display: inline-flex; gap: 2px; }
    /* Title-screen controls hint visibility:
       By default hide BOTH variants, then reveal exactly one based on the device type.
       This avoids any flash of the wrong hint on devices that match neither query cleanly. */
    .controls-hint .hint-row { display: none; }
    .controls-hint .mobile-hint { display: none; }
    @media (hover: hover) and (pointer: fine) {
      /* Desktop: show key-hint rows, keep mobile hint hidden. */
      .controls-hint .hint-row:not(.mobile-hint) { display: flex; }
    }
    @media (hover: none), (pointer: coarse) {
      /* Touch / mobile: show only the mobile hint row, no keyboard chips. */
      .controls-hint .mobile-hint { display: flex; }
      .controls-hint .hint-row:not(.mobile-hint) { display: none !important; }
    }

    /* Desktop: slightly dim the on-screen controls since keyboard is primary */
    @media (hover: hover) and (pointer: fine) {
      #controls { opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div id="renderDiv"></div>

  <div id="hud">
    <div class="scoreboard">
      <div class="team-badge t1">P</div>
      <div class="score-num" id="score1">0</div>
      <div class="timer" id="timer">2:00</div>
      <div class="score-num" id="score2">0</div>
      <div class="team-badge t2">C</div>
    </div>
  </div>

  <div id="controls">
    <div id="joystick">
      <div id="stick"></div>
    </div>
    <div class="btn-stack">
      <button class="action-btn" id="btn-pass">
        <span class="keycap">SHIFT</span>
        PASS
      </button>
      <button class="action-btn" id="btn-shoot">
        <span class="keycap">SPACE</span>
        SHOOT
      </button>
    </div>
  </div>

  <!-- Title screen -->
  <div class="overlay" id="title-screen">
    <div class="panel">
      <div class="title-emoji">⚽</div>
      <h1>KICKO!</h1>
      <div class="sub">POCKET SOCCER</div>
      <button class="big-btn" id="play-btn">PLAY</button>
      <button class="big-btn download-btn" id="download-btn" type="button">ZIP HERUNTERLADEN</button>
      <div id="download-status" role="status" aria-live="polite"></div>
      <div class="controls-hint">
        <div class="hint-row">
          <span class="kbd-row">
            <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span>
          </span>
          or <span class="kbd">↑</span><span class="kbd">←</span><span class="kbd">↓</span><span class="kbd">→</span>
          &nbsp;Move
        </div>
        <div class="hint-row">
          <span class="kbd kbd-wide">SPACE</span> Shoot &nbsp;·&nbsp;
          <span class="kbd kbd-wide">SHIFT</span> Pass
        </div>
        <div class="hint-row" style="opacity:0.75">
          Control auto-switches to whoever has the ball
        </div>
        <div class="hint-row mobile-hint">
          Drag joystick · Tap buttons
        </div>
      </div>
    </div>
  </div>

  <!-- Goal banner -->
  <div class="overlay hidden" id="goal-screen">
    <div class="goal-banner" id="goal-text">GOAL!</div>
  </div>

  <!-- Set-piece banner (throw-in / goal kick) -->
  <div id="setpiece-banner" class="hidden">
    <div class="setpiece-text" id="setpiece-text">THROW IN</div>
  </div>

  <!-- Modifier announcement -->
  <div id="modifier-banner" class="hidden">
    <div class="mod-emoji" id="mod-emoji">⚡</div>
    <div class="mod-title" id="mod-title">SPEED BOOST!</div>
    <div class="mod-sub" id="mod-sub">Everyone is faster</div>
  </div>

  <!-- Active modifier chip in HUD -->
  <div id="modifier-chip" class="hidden">
    <span id="modifier-chip-emoji">⚡</span>
    <span id="modifier-chip-text">SPEED</span>
    <span id="modifier-chip-time">10</span>
  </div>

  <!-- End screen -->
  <div class="overlay hidden" id="end-screen">
    <div class="panel">
      <h1 id="end-title">FULL TIME</h1>
      <div class="sub" id="end-sub">Great match!</div>
      <button class="big-btn" id="rematch-btn">REMATCH</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
  <script type="module" src="./download.js"></script>
</body>
</html>
